<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFFFFF">
  <title>Administrator sign in — WELLEXSA MOTORS</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="index.html" aria-label="WELLEXSA Motors home"><img class="brand-logo" src="assets/images/wellexsa-logo.png" alt="WELLEXSA Motors emblem and wordmark"></a><a class="text-link" href="index.html">← Back to showroom</a></header>
  <main class="auth-layout auth-layout-centered admin-auth-layout">
    <section class="auth-form-wrap">
      <div class="auth-form-heading"><p class="eyebrow">ADMINISTRATOR ACCESS</p><h2>Sign in</h2><p>Use your authorized administrator account.</p></div>
      <form id="admin-login-form" class="form-stack">
        <label>Administrator username<input name="username" type="text" autocomplete="username" minlength="3" maxlength="32" pattern="[A-Za-z0-9._-]{3,32}" title="Use 3 to 32 letters, numbers, periods, underscores or hyphens." required></label>
        <label>Password<span class="password-input"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></span></label>
        <p class="form-message" id="form-message" role="alert"></p>
        <button class="button button-dark button-full" type="submit">Admin sign in <span aria-hidden="true">→</span></button>
      </form>
    </section>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
