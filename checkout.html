<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFFFFF">
  <title>Secure checkout — WELLEXSA MOTORS</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body>
  <header class="site-header"><a class="brand" href="index.html" aria-label="WELLEXSA Motors home"><img class="brand-logo" src="assets/images/wellexsa-logo.png" alt="WELLEXSA Motors emblem and wordmark"></a><a class="text-link" href="cart.html">← Back to cart</a></header>
  <main class="checkout-main"><p class="eyebrow">SECURE CHECKOUT</p><h1>Delivery details<span class="accent">.</span></h1><p class="checkout-intro">Razorpay securely processes UPI, supported cards and net banking. WELLEXSA MOTORS does not store payment credentials.</p>
    <form id="checkout-form" class="checkout-form">
      <label>Full name<input name="name" autocomplete="name" maxlength="100" required></label>
      <label>Mobile number<input name="phone" type="tel" autocomplete="tel" inputmode="tel" pattern="\+?[0-9 \(\)\-]{10,18}" required></label>
      <label>Email address<input name="email" type="email" autocomplete="email" readonly required></label>
      <label class="field-wide">Delivery address<input name="address" autocomplete="street-address" maxlength="240" required></label>
      <label>City<input name="city" autocomplete="address-level2" maxlength="100" required></label>
      <label>State<input name="state" autocomplete="address-level1" maxlength="100" required></label>
      <label>PIN code<input name="postalCode" autocomplete="postal-code" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required></label>
      <section class="checkout-summary field-wide" aria-labelledby="checkout-summary-title"><h2 id="checkout-summary-title">Order summary</h2><div id="checkout-items"><p class="summary-note">Checking your cart…</p></div></section>
      <div class="checkout-total"><span>Total due</span><strong id="checkout-total">Checking cart…</strong></div>
      <p class="form-message field-wide" id="checkout-message" role="alert"></p>
      <button class="button button-dark field-wide" id="pay-button" type="submit" disabled>Continue to secure payment ↗</button>
    </form>
  </main>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script type="module" src="js/checkout.js"></script>
</body>
</html>
