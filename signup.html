<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFFFFF">
  <title>Create account — WELLEXSA MOTORS</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="index.html" aria-label="WELLEXSA Motors home"><img class="brand-logo" src="assets/images/wellexsa-logo.png" alt="WELLEXSA Motors emblem and wordmark"></a><button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="index.html#bikes">Explore Bikes</a><a href="index.html#about">About Us</a><a href="index.html#contact">Contact</a></nav></header>
  <main class="auth-layout auth-layout-centered">
    <section class="auth-form-wrap">
      <div class="auth-form-heading"><p class="eyebrow">CUSTOMER ACCOUNT</p><h2>Create your account</h2><p>Just a few details to get started.</p></div>
      <form id="signup-form" class="form-stack">
        <label>Full name<input name="name" type="text" autocomplete="name" minlength="2" maxlength="100" required></label>
        <label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
        <label>Mobile number<input name="mobile" type="tel" autocomplete="tel" inputmode="tel" pattern="\+?[0-9 \(\)\-]{10,18}" title="Enter a valid phone number" required></label>
        <label>Password<span class="password-input"><input name="password" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></span></label>
        <label>Confirm password<span class="password-input"><input name="confirmPassword" type="password" autocomplete="new-password" minlength="8" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></span></label>
        <p class="form-message" id="form-message" role="alert"></p>
        <button class="button button-dark button-full" type="submit">Create account <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch" id="signup-profile-recovery" hidden><a href="account.html">Continue to My Account</a></p>
      <p class="auth-switch">Already have an account? <a href="signin.html">Sign in</a></p>
    </section>
  </main>
  <script type="module" src="js/site-nav.js"></script><script type="module" src="js/auth.js"></script>
</body>
</html>
