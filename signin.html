<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFFFFF">
  <title>Sign in — WELLEXSA MOTORS</title><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body class="auth-page">
  <header class="site-header auth-header"><a class="brand" href="index.html" aria-label="WELLEXSA Motors home"><img class="brand-logo" src="assets/images/wellexsa-logo.png" alt="WELLEXSA Motors emblem and wordmark"></a><button class="menu-toggle" type="button" aria-label="Open navigation" aria-expanded="false">☰</button><nav class="main-nav" aria-label="Main navigation"><a href="index.html">Home</a><a href="index.html#bikes">Explore Bikes</a><a href="index.html#about">About Us</a><a href="index.html#contact">Contact</a></nav><a class="nav-cart" href="cart.html" aria-label="Shopping cart"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.5a2 2 0 0 0 1.9-1.4L21 9H6"/><circle cx="10" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></svg><span>Cart</span><span class="cart-count">0</span></a></header>
  <main class="auth-layout auth-layout-centered">
    <section class="auth-form-wrap">
      <div class="auth-form-heading"><p class="eyebrow">CUSTOMER ACCOUNT</p><h2>Welcome back</h2><p>Sign in to your account to continue.</p></div>
      <form id="signin-form" class="form-stack">
        <label>Email address<input name="email" type="email" autocomplete="email" maxlength="254" required></label>
        <label>Password<span class="password-input"><input name="password" type="password" autocomplete="current-password" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></span></label>
        <button class="forgot-password" id="forgot-password" type="button">Forgot password?</button>
        <p class="form-message" id="form-message" role="alert"></p>
        <button class="button button-dark button-full" type="submit">Sign in <span aria-hidden="true">→</span></button>
      </form>
      <p class="auth-switch">New to WELLEXSA? <a href="signup.html">Create an account</a></p>
      <p class="auth-switch auth-admin-link">Administrator? <a href="admin-login.html">Admin Login</a></p>
    </section>
  </main>
  <script type="module" src="js/site-nav.js"></script><script type="module" src="js/auth.js"></script>
</body>
</html>
