<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Staff sign in — WELLEXSA MOTORS</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/crm.css">
</head>
<body class="crm-login-page" data-crm-login-role="staff">
  <main class="crm-login-card">
    <a class="crm-brand" href="../index.html">
      <img src="../assets/images/wellexsa-logo.png" alt="WELLEXSA Motors">
    </a>
    <p class="crm-eyebrow">PRIVATE SHOWROOM CRM · STAFF</p>
    <h1>Staff sign in</h1>
    <p class="crm-muted">Use the account provided by the showroom Owner.</p>
    <form id="crm-login-form" class="crm-form">
      <label>Email address<input name="email" type="email" autocomplete="username" maxlength="254" required></label>
      <label>Password<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="crm-message" role="alert" id="crm-login-message"></p>
      <button class="crm-button crm-button-primary" type="submit">Sign in</button>
    </form>
    <p class="crm-login-switch">Owner? <a href="owner-login.html">Owner sign in</a></p>
  </main>
  <script type="module" src="../js/crm-login.js"></script>
</body>
</html>
