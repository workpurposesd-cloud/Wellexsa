<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#FFFFFF">
  <title>Change administrator password — WELLEXSA MOTORS</title>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body class="auth-page">
  <header class="site-header auth-header">
    <a class="brand" href="index.html" aria-label="WELLEXSA Motors home"><img class="brand-logo" src="assets/images/wellexsa-logo.png" alt="WELLEXSA Motors emblem and wordmark"></a>
  </header>
  <main class="admin-password-main">
    <p class="eyebrow">SECURE ADMINISTRATOR ACCESS</p>
    <h1>Choose a new password.</h1>
    <p class="account-intro">On first sign-in, replace the temporary password. Later changes require confirming your current password.</p>
    <form id="admin-password-form" class="form-stack">
      <label id="current-password-field" hidden>Current password<span class="password-input"><input name="currentPassword" type="password" autocomplete="current-password" minlength="8"><button type="button" class="password-toggle" aria-label="Show password">Show</button></span></label>
      <label>New password<span class="password-input"><input name="password" type="password" autocomplete="new-password" minlength="12" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></span></label>
      <label>Confirm new password<span class="password-input"><input name="confirmPassword" type="password" autocomplete="new-password" minlength="12" required><button type="button" class="password-toggle" aria-label="Show password">Show</button></span></label>
      <p class="form-message" id="form-message" role="alert"></p>
      <button class="button button-dark button-full" type="submit">Update password</button>
    </form>
  </main>
  <script type="module" src="js/auth.js"></script>
</body>
</html>
